  <div id="root"></div>

  <!-- SEED_DATA_START -->
  <script id="twiggy-seed-data">
    window.__TWIGGY_SAVED_DATA__ = {
  "beans": [
    { "id": "1", "origin": "Twiggy Signature Blend", "rawGreenCost": 12.5, "greenDeliveryCost": 12, "defaultLossPct": 15, "targetMarginPct": 50 },
    { "id": "2", "origin": "Colombia Huila Single Origin", "rawGreenCost": 11.2, "greenDeliveryCost": 12, "defaultLossPct": 15, "targetMarginPct": 50 },

    { "id": "4", "origin": "Guatemala Antigua Pastoral", "rawGreenCost": 10.8, "greenDeliveryCost": 12, "defaultLossPct": 15, "targetMarginPct": 50 },
    { "id": "1788429949083", "origin": "萨尔瓦多圣华金庄园红波旁日晒", "rawGreenCost": 124, "greenDeliveryCost": 12, "defaultLossPct": 15, "targetMarginPct": 50 },
    { "id": "1788430165521", "origin": "巴布亚新几内亚哈根山AX水洗", "rawGreenCost": 82, "greenDeliveryCost": 12, "defaultLossPct": 15, "targetMarginPct": 50 },
    { "id": "1788430233158", "origin": "哥斯达黎加塔拉珠SHB水洗", "rawGreenCost": 92, "greenDeliveryCost": 12, "defaultLossPct": 15, "targetMarginPct": 50 },
    { "id": "1788430858975", "origin": "哥倫比亞 白山莊園 西瓜酵母發酵水洗", "rawGreenCost": 220, "greenDeliveryCost": 12, "defaultLossPct": 15, "targetMarginPct": 50 },
    { "id": "1788430929673", "origin": "埃塞俄比亞 西達摩 班莎 G1 酵母厭氧日曬", "rawGreenCost": 175, "greenDeliveryCost": 12, "defaultLossPct": 15, "targetMarginPct": 50 }
  ],
  "batches": [
    { "id": 1788430933088, "date": "2026-09-03", "origin": "埃塞俄比亞 西達摩 班莎 G1 酵母厭氧日曬", "greenKg": 2.5, "roastedKg": 2.1, "totalBatchCost": 988, "cogsPerRoastedKg": 470.48, "lossPct": 16, "targetMarginPct": 50, "bagSizeGrams": 100, "suggestedPricePerKg": 940.95, "suggestedRetailPerBag": 94.1 },
    { "id": 1788430868026, "date": "2026-09-03", "origin": "哥倫比亞 白山莊園 西瓜酵母發酵水洗", "greenKg": 2.5, "roastedKg": 2.1, "totalBatchCost": 1100.5, "cogsPerRoastedKg": 524.05, "lossPct": 16, "targetMarginPct": 50, "bagSizeGrams": 100, "suggestedPricePerKg": 1048.1, "suggestedRetailPerBag": 104.81 },
    { "id": 1788430262791, "date": "2026-09-03", "origin": "哥斯达黎加塔拉珠SHB水洗", "greenKg": 2.5, "roastedKg": 2.13, "totalBatchCost": 568.75, "cogsPerRoastedKg": 267.65, "lossPct": 15, "targetMarginPct": 50, "bagSizeGrams": 100, "suggestedPricePerKg": 535.29, "suggestedRetailPerBag": 53.53 },
    { "id": 1788430179948, "date": "2026-09-03", "origin": "巴布亚新几内亚哈根山AX水洗", "greenKg": 2.5, "roastedKg": 2.1, "totalBatchCost": 540.5, "cogsPerRoastedKg": 257.38, "lossPct": 16, "targetMarginPct": 50, "bagSizeGrams": 100, "suggestedPricePerKg": 514.76, "suggestedRetailPerBag": 51.48 },
    { "id": 1788429964931, "date": "2026-09-03", "origin": "萨尔瓦多圣华金庄园红波旁日晒", "greenKg": 2.5, "roastedKg": 2.13, "totalBatchCost": 648.75, "cogsPerRoastedKg": 305.29, "lossPct": 15, "targetMarginPct": 50, "bagSizeGrams": 100, "suggestedPricePerKg": 610.59, "suggestedRetailPerBag": 61.06 }
  ]
};
  </script>
  <!-- SEED_DATA_END -->

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const getInitialDataset = () => {
      // Prioritize file embedded data first to guarantee external portability
      if (window.__TWIGGY_SAVED_DATA__ && window.__TWIGGY_SAVED_DATA__.beans?.length) {
        return window.__TWIGGY_SAVED_DATA__;
      }
      try {
        const local = localStorage.getItem('__twiggy_roast_data__');
        if (local) {
          const parsed = JSON.parse(local);
          if (parsed && parsed.beans && parsed.batches) return parsed;
        }
      } catch (e) {}
      return { beans: [], batches: [] };
    };

    function App() {
      const initial = useMemo(() => getInitialDataset(), []);
      
      const [imgFailed, setImgFailed] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const [beanTypes, setBeanTypes] = useState(initial.beans);
      const [batches, setBatches] = useState(initial.batches);

      const [isAddingBean, setIsAddingBean] = useState(false);
      const [isManagingBeans, setIsManagingBeans] = useState(false);
      const [newOrigin, setNewOrigin] = useState('');
      const [newRawCost, setNewRawCost] = useState('');
      const [newInboundDelivery, setNewInboundDelivery] = useState('12.00');
      const [newLoss, setNewLoss] = useState(15.0);
      const [newMargin, setNewMargin] = useState(50);

      const [selectedBeanId, setSelectedBeanId] = useState(initial.beans[0]?.id || '1');
      const [batchGreenKg, setBatchGreenKg] = useState(2.5);
      const [moistureLossPct, setMoistureLossPct] = useState(15.0);
      const [targetMarginPct, setTargetMarginPct] = useState(50);
      const [packageSizeGrams, setPackageSizeGrams] = useState(100);

      const [rawGreenPricePerKg, setRawGreenPricePerKg] = useState(initial.beans[0]?.rawGreenCost || 12.50);
      const [greenDeliveryPerKg, setGreenDeliveryPerKg] = useState(12.00);

      const [energyCostPerKg, setEnergyCostPerKg] = useState(2.00);
      const [laborCostPerKg, setLaborCostPerKg] = useState(8.00);
      const [overheadPerKg, setOverheadPerKg] = useState(5.00);

      const [packagingCostPerKg, setPackagingCostPerKg] = useState(130.00);
      const [transportCostPerKg, setTransportCostPerKg] = useState(100.00);

      useEffect(() => {
        try {
          localStorage.setItem('__twiggy_roast_data__', JSON.stringify({ beans: beanTypes, batches }));
        } catch (e) {}
      }, [beanTypes, batches]);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2500);
      };

      const activeBean = useMemo(() => {
        return beanTypes.find(b => b.id === selectedBeanId) || beanTypes[0] || {};
      }, [beanTypes, selectedBeanId]);

      const handleBeanSelect = (beanId) => {
        setSelectedBeanId(beanId);
        const b = beanTypes.find(item => item.id === beanId);
        if (b) {
          setRawGreenPricePerKg(b.rawGreenCost);
          setGreenDeliveryPerKg(b.greenDeliveryCost || 12.00);
          setMoistureLossPct(b.defaultLossPct || 15.0);
          setTargetMarginPct(b.targetMarginPct || 50);
        }
      };

      const handleCreateBeanType = (e) => {
        e.preventDefault();
        if (!newOrigin.trim() || !newRawCost) return;
        const newBean = {
          id: Date.now().toString(),
          origin: newOrigin.trim(),
          rawGreenCost: parseFloat(newRawCost) || 0,
          greenDeliveryCost: parseFloat(newInboundDelivery) || 12.0,
          defaultLossPct: parseFloat(newLoss) || 15.0,
          targetMarginPct: Math.min(99, Math.max(1, parseFloat(newMargin) || 50))
        };
        const updated = [...beanTypes, newBean];
        setBeanTypes(updated);
        setSelectedBeanId(newBean.id);
        setRawGreenPricePerKg(newBean.rawGreenCost);
        setGreenDeliveryPerKg(newBean.greenDeliveryCost);
        setMoistureLossPct(newBean.defaultLossPct);
        setTargetMarginPct(newBean.targetMarginPct);
        setNewOrigin('');
        setNewRawCost('');
        setNewInboundDelivery('12.00');
        setNewLoss(15.0);
        setNewMargin(50);
        setIsAddingBean(false);
        triggerToast('新咖啡豆品已成功保存 (New lot added)');
      };

      const handleDeleteBeanType = (id, originName) => {
        if (beanTypes.length <= 1) {
          alert('至少需保留一種咖啡豆品類 (Must keep at least one bean variety)');
          return;
        }
        if (!confirm(`確定要刪除「${originName}」嗎？\n(Are you sure you want to remove "${originName}"?)`)) {
          return;
        }
        const updated = beanTypes.filter(b => b.id !== id);
        setBeanTypes(updated);
        if (selectedBeanId === id) {
          const next = updated[0];
          setSelectedBeanId(next.id);
          setRawGreenPricePerKg(next.rawGreenCost);
          setGreenDeliveryPerKg(next.greenDeliveryCost || 12.00);
          setMoistureLossPct(next.defaultLossPct || 15.0);
          setTargetMarginPct(next.targetMarginPct || 50);
        }
        triggerToast(`已刪除豆品: ${originName}`);
      };

      const calcs = useMemo(() => {
        const safeBatchGreenKg = Math.max(0, batchGreenKg || 0);
        const safeLossPct = Math.min(99, Math.max(0, moistureLossPct || 0));
        const safeMarginPct = Math.min(99, Math.max(0, targetMarginPct || 0));

        const landedGreenPerKg = (rawGreenPricePerKg || 0) + (greenDeliveryPerKg || 0);
        const greenCostTotal = safeBatchGreenKg * landedGreenPerKg;

        const totalOpsPerKgGreen = (energyCostPerKg || 0) + (laborCostPerKg || 0) + (overheadPerKg || 0);
        const opsCostTotal = safeBatchGreenKg * totalOpsPerKgGreen;

        const roastedKg = safeBatchGreenKg * (1 - (safeLossPct / 100));

        const packCostTotal = roastedKg * (packagingCostPerKg || 0);
        const freightCostTotal = roastedKg * (transportCostPerKg || 0);

        const totalBatchCost = greenCostTotal + opsCostTotal + packCostTotal + freightCostTotal;
        const cogsPerRoastedKg = roastedKg > 0 ? totalBatchCost / roastedKg : 0;
        
        const bagWeightFactor = (packageSizeGrams || 100) / 1000;
        const cogsPerBag = cogsPerRoastedKg * bagWeightFactor;

        const marginFactor = 1 - (safeMarginPct / 100);
        const wholesalePerKg = marginFactor > 0 ? cogsPerRoastedKg / marginFactor : 0;
        const retailPricePerBag = wholesalePerKg * bagWeightFactor;

        return {
          landedGreenPerKg,
          greenCostTotal,
          totalOpsPerKgGreen,
          opsCostTotal,
          roastedKg,
          totalBatchCost,
          cogsPerRoastedKg,
          cogsPerBag,
          wholesalePerKg,
          retailPricePerBag
        };
      }, [
        batchGreenKg, rawGreenPricePerKg, greenDeliveryPerKg, moistureLossPct,
        energyCostPerKg, laborCostPerKg, overheadPerKg, packagingCostPerKg,
        transportCostPerKg, targetMarginPct, packageSizeGrams
      ]);

      const handleRecordBatch = () => {
        const newBatch = {
          id: Date.now(),
          date: new Date().toISOString().split('T')[0],
          origin: activeBean.origin || 'Twiggy 特選烘焙',
          greenKg: parseFloat(batchGreenKg) || 0,
          roastedKg: parseFloat(calcs.roastedKg.toFixed(2)),
          totalBatchCost: parseFloat(calcs.totalBatchCost.toFixed(2)),
          cogsPerRoastedKg: parseFloat(calcs.cogsPerRoastedKg.toFixed(2)),
          lossPct: parseFloat(moistureLossPct) || 0,
          targetMarginPct: parseFloat(targetMarginPct) || 0,
          bagSizeGrams: parseFloat(packageSizeGrams) || 100,
          suggestedPricePerKg: parseFloat(calcs.wholesalePerKg.toFixed(2)),
          suggestedRetailPerBag: parseFloat(calcs.retailPricePerBag.toFixed(2))
        };
        setBatches([newBatch, ...batches]);
        triggerToast('烘豆批次已記錄 (Batch recorded)');
      };

      const handleDeleteBatch = (id) => {
        setBatches(batches.filter(b => b.id !== id));
      };

      // Robust HTML download that guarantees fresh script tag updates without re-transpilation issues
      const handleSaveHtmlFile = () => {
        const currentData = {
          beans: beanTypes,
          batches: batches
        };
        const jsonString = JSON.stringify(currentData, null, 2);

        // Fetch pristine outerHTML and clean out React's hydrated tree
        let source = document.documentElement.outerHTML;
        source = source.replace(/<div id="root">[\s\S]*?<\/div>/, '<div id="root"></div>');

        // Swap the JSON payload reliably
        const seedRegex = /<!-- SEED_DATA_START -->[\s\S]*?<!-- SEED_DATA_END -->/;
        const newSeed = `<!-- SEED_DATA_START -->\n  <script id="twiggy-seed-data">\n    window.__TWIGGY_SAVED_DATA__ = ${jsonString};\n  <\/script>\n  <!-- SEED_DATA_END -->`;
        
        let finalHtml = '<!DOCTYPE html>\n' + source.replace(seedRegex, newSeed);

        const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `twiggy_roaster_${new Date().toISOString().split('T')[0]}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        triggerToast('已保存並下載最新 HTML 檔案');
      };

      const handleExportExcel = () => {
        if (batches.length === 0) return;
        const exportData = batches.map(b => ({
          '日期 (Date)': b.date,
          '豆品名稱 / 批次 (Origin / Lot)': b.origin,
          '生豆重量 kg (Green Input)': b.greenKg,
          '熟豆產出 kg (Roasted Yield)': b.roastedKg,
          '烘焙失重率 % (Moisture Loss)': b.lossPct,
          '總成本 $ (Total COGS)': b.totalBatchCost,
          '每公斤熟豆成本 $/kg (COGS/kg)': b.cogsPerRoastedKg,
          '包裝克重 g (Bag Size)': b.bagSizeGrams,
          '目標毛利率 % (Target Margin)': b.targetMarginPct,
          '建議包裝零售價 $ (Retail Price/Bag)': b.suggestedRetailPerBag,
          '建議批發每公斤價 $ (Wholesale/kg)': b.suggestedPricePerKg
        }));

        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Twiggy烘焙記錄');
        XLSX.writeFile(wb, `Twiggy_Coffee_烘豆日誌_${new Date().toISOString().split('T')[0]}.xlsx`);
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-10">
          
          {/* Header */}
          <nav className="flex flex-col md:flex-row md:items-center justify-between pb-8 mb-8 border-b border-roast-200 gap-6">
            <div className="flex flex-col sm:flex-row sm:items-center gap-6">
              <div className="flex items-center">
                {!imgFailed ? (
                  <img 
                    src="Ez07MuBoTflg6PIYDGY6HylWnXdO7sYINKooaXOH.webp" 
                    alt="Twiggy Coffee" 
                    className="h-14 sm:h-16 w-auto object-contain"
                    onError={() => setImgFailed(true)}
                  />
                ) : (
                  <div className="font-serif">
                    <span className="text-2xl font-bold tracking-wider text-roast-950">Twiggy</span>
                    <span className="text-xs uppercase tracking-widest block text-stone-500">COFFEE</span>
                  </div>
                )}
              </div>

              <div className="hidden sm:block h-10 w-[1px] bg-roast-200"></div>

              <div>
                <p className="text-xs font-serif tracking-widest text-roast-900 font-bold">
                  平衡，是懂得取捨的溫柔
                </p>
                <p className="text-[11px] text-stone-400 tracking-tight font-serif italic mt-0.5">
                  Balance is the gentleness found in knowing what to hold and what to let go.
                </p>
              </div>
            </div>

            <div className="flex items-center gap-2.5 self-start md:self-center">
              <button
                type="button"
                onClick={handleSaveHtmlFile}
                className="inline-flex items-center gap-2 px-4 py-2.5 text-xs font-semibold text-roast-900 bg-white border border-roast-200 rounded-xl shadow-sm hover:bg-roast-100 transition"
              >
                <svg className="w-3.5 h-3.5 text-copper-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                </svg>
                <span>保存至 HTML (Save)</span>
              </button>

              <button
                type="button"
                onClick={handleExportExcel}
                className="inline-flex items-center gap-2 px-4 py-2.5 text-xs font-semibold text-white bg-roast-950 rounded-xl shadow-sm hover:bg-black transition"
              >
                <svg className="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span>匯出 Excel (Export)</span>
              </button>
            </div>
          </nav>

          {/* Metric Cards */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div className="bg-white p-5 rounded-2xl border border-roast-200 shadow-sm relative overflow-hidden">
              <span className="text-[11px] font-bold uppercase tracking-wider text-stone-400 block">
                熟豆產出 (Roasted Yield)
              </span>
              <div className="mt-2 flex items-baseline gap-1.5">
                <span className="text-3xl font-extrabold text-roast-950 font-mono">{calcs.roastedKg.toFixed(2)}</span>
                <span className="text-sm font-semibold text-stone-500">kg (公斤)</span>
              </div>
              <p className="mt-1 text-xs text-stone-500 font-medium">源自 {batchGreenKg} kg 生豆 (失重率 –{moistureLossPct}%)</p>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-roast-200 shadow-sm relative overflow-hidden">
              <span className="text-[11px] font-bold uppercase tracking-wider text-stone-400 block">
                批次總成本 (Batch Net Cost)
              </span>
              <div className="mt-2 flex items-baseline gap-1">
                <span className="text-sm font-bold text-stone-500">$</span>
                <span className="text-3xl font-extrabold text-roast-950 font-mono">{calcs.totalBatchCost.toFixed(2)}</span>
              </div>
              <p className="mt-1 text-xs text-stone-500 font-medium">生豆到廠 + 烘焙營運 + 包裝運送</p>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-roast-200 shadow-sm relative overflow-hidden">
              <span className="text-[11px] font-bold uppercase tracking-wider text-stone-400 block">
                單包單位成本 (Unit COGS)
              </span>
              <div className="mt-2 flex items-baseline gap-1 text-emerald-800">
                <span className="text-sm font-bold">$</span>
                <span className="text-3xl font-extrabold font-mono">{calcs.cogsPerBag.toFixed(2)}</span>
                <span className="text-xs font-semibold text-stone-400 font-sans">/ {packageSizeGrams}g 包</span>
              </div>
              <p className="mt-1 text-xs text-stone-500 font-medium">${calcs.cogsPerRoastedKg.toFixed(2)} / 每公斤熟豆成本</p>
            </div>

            <div className="bg-gradient-to-br from-amber-50 to-orange-50/50 p-5 rounded-2xl border border-amber-200 shadow-sm relative overflow-hidden">
              <span className="text-[11px] font-bold uppercase tracking-wider text-copper-600 block">
                目標建議售價 (Target Retail Price)
              </span>
              <div className="mt-2 flex items-baseline gap-1 text-roast-950">
                <span className="text-sm font-bold">$</span>
                <span className="text-3xl font-extrabold font-mono">{calcs.retailPricePerBag.toFixed(2)}</span>
                <span className="text-xs font-semibold text-stone-500 font-sans">/ {packageSizeGrams}g 零售</span>
              </div>
              <div className="mt-1 flex items-center justify-between text-xs font-medium text-copper-600">
                <span>目標毛利 {targetMarginPct}%</span>
                <span>${calcs.wholesalePerKg.toFixed(2)} / kg 批發</span>
              </div>
            </div>
          </div>

          {/* Form & Sidebar Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-12">
            <div className="lg:col-span-8 space-y-6">
              
              {/* Variety & Batch Setup */}
              <div className="bg-white p-6 rounded-2xl border border-roast-200 shadow-sm">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-5 border-b border-roast-100 gap-3">
                  <div>
                    <h2 className="text-base font-bold text-roast-950">1. 選擇豆品與批次重量 (Select Origin & Batch Size)</h2>
                    <p className="text-xs text-stone-500">從庫存選擇咖啡豆品種，並輸入本次烘焙生豆投料量。</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => { setIsManagingBeans(!isManagingBeans); setIsAddingBean(false); }}
                      className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                        isManagingBeans ? 'bg-amber-800 text-white' : 'bg-roast-100 text-roast-800 hover:bg-roast-200'
                      }`}
                    >
                      <span>{isManagingBeans ? '完成管理 (Done)' : '管理/刪除品類 (Manage Beans)'}</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => { setIsAddingBean(!isAddingBean); setIsManagingBeans(false); }}
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-copper-500 text-white hover:bg-copper-600 transition"
                    >
                      <span className="text-sm font-bold">{isAddingBean ? '✕' : '+'}</span>
                      <span>{isAddingBean ? '關閉 (Close)' : '新增豆品品類 (+ Add Bean)'}</span>
                    </button>
                  </div>
                </div>

                {isManagingBeans && (
                  <div className="mb-6 p-4 rounded-xl bg-amber-50/70 border border-amber-200">
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-amber-950">管理現有品類 (點擊紅色 ✕ 刪除品項)</h3>
                      <span className="text-[11px] text-stone-500">共 {beanTypes.length} 種品類</span>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {beanTypes.map((bean) => (
                        <div key={bean.id} className="flex items-center justify-between p-2.5 bg-white rounded-lg border border-roast-200 shadow-xs">
                          <div className="overflow-hidden pr-2">
                            <span className="font-bold text-xs text-roast-900 block truncate">{bean.origin}</span>
                            <span className="text-[10px] text-stone-400">底價: ${bean.rawGreenCost} / 運費: ${bean.greenDeliveryCost} / 毛利: {bean.targetMarginPct}%</span>
                          </div>
                          <button
                            type="button"
                            onClick={() => handleDeleteBeanType(bean.id, bean.origin)}
                            className="text-stone-400 hover:text-rose-600 p-1.5 rounded hover:bg-rose-50 transition flex-shrink-0"
                            title="刪除此豆品 (Delete Bean)"
                          >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {isAddingBean && (
                  <form onSubmit={handleCreateBeanType} className="mb-6 p-4 rounded-xl bg-roast-50 border border-roast-200">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-roast-700 mb-3">新增咖啡品項庫存 (Add Coffee Lot)</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div className="sm:col-span-3">
                        <label className="text-[11px] font-semibold text-stone-600">品名 / 產區 / 莊園 (Variety / Origin / Farm)</label>
                        <input
                          type="text"
                          required
                          placeholder="例如: 薩爾瓦多 聖華金莊園 紅波旁 日曬"
                          value={newOrigin}
                          onChange={(e) => setNewOrigin(e.target.value)}
                          className="w-full mt-1 px-3 py-2 text-xs font-medium rounded-lg border border-roast-200 bg-white focus:outline-none focus:ring-2 focus:ring-copper-500"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-semibold text-stone-600">生豆底價 $/kg (FOB Cost)</label>
                        <input
                          type="number"
                          step="0.10"
                          required
                          placeholder="例如: 120.00"
                          value={newRawCost}
                          onChange={(e) => setNewRawCost(e.target.value)}
                          className="w-full mt-1 px-3 py-2 text-xs font-medium rounded-lg border border-roast-200 bg-white focus:outline-none focus:ring-2 focus:ring-copper-500"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-semibold text-stone-600">進貨運費 $/kg (Inbound Freight)</label>
                        <input
                          type="number"
                          step="0.05"
                          value={newInboundDelivery}
                          onChange={(e) => setNewInboundDelivery(e.target.value)}
                          className="w-full mt-1 px-3 py-2 text-xs font-medium rounded-lg border border-roast-200 bg-white focus:outline-none focus:ring-2 focus:ring-copper-500"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-semibold text-stone-600">目標毛利率 % (Target Margin)</label>
                        <input
                          type="number"
                          value={newMargin}
                          onChange={(e) => setNewMargin(e.target.value)}
                          className="w-full mt-1 px-3 py-2 text-xs font-medium rounded-lg border border-roast-200 bg-white focus:outline-none focus:ring-2 focus:ring-copper-500"
                        />
                      </div>
                    </div>
                    <div className="mt-3 flex justify-end">
                      <button
                        type="submit"
                        className="px-4 py-2 bg-roast-900 text-white rounded-lg text-xs font-bold hover:bg-black transition"
                      >
                        儲存至豆單 (Save to Catalog)
                      </button>
                    </div>
                  </form>
                )}

                <div className="grid grid-cols-1 sm:grid-cols-12 gap-4">
                  <div className="sm:col-span-6">
                    <label className="block text-xs font-bold text-stone-700 mb-1.5">咖啡豆品名 (Coffee Lot / Origin)</label>
                    <select
                      value={selectedBeanId}
                      onChange={(e) => handleBeanSelect(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-roast-200 bg-roast-50 font-semibold text-xs text-roast-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-copper-500"
                    >
                      {beanTypes.map(bean => (
                        <option key={bean.id} value={bean.id}>
                          {bean.origin}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="sm:col-span-3">
                    <label className="block text-xs font-bold text-stone-700 mb-1.5">生豆投料量 (Green Weight)</label>
                    <div className="relative">
                      <input
                        type="number"
                        step="0.1"
                        min="0.1"
                        value={batchGreenKg}
                        onChange={(e) => setBatchGreenKg(parseFloat(e.target.value) || 0)}
                        className="w-full pl-3.5 pr-8 py-2.5 rounded-xl border border-roast-200 font-mono font-bold text-xs text-roast-900 focus:outline-none focus:ring-2 focus:ring-copper-500"
                      />
                      <span className="absolute right-3 top-2.5 text-xs text-stone-400 font-medium">kg</span>
                    </div>
                  </div>

                  <div className="sm:col-span-3">
                    <label className="block text-xs font-bold text-stone-700 mb-1.5">失重率 (Moisture Loss)</label>
                    <div className="relative">
                      <input
                        type="number"
                        step="0.1"
                        min="5"
                        max="28"
                        value={moistureLossPct}
                        onChange={(e) => setMoistureLossPct(parseFloat(e.target.value) || 0)}
                        className="w-full pl-3.5 pr-8 py-2.5 rounded-xl border border-roast-200 font-mono font-bold text-xs text-roast-900 focus:outline-none focus:ring-2 focus:ring-copper-500"
                      />
                      <span className="absolute right-3 top-2.5 text-xs text-stone-400 font-bold">%</span>
                    </div>
                  </div>
                </div>

                {/* Packaging Size Quick Buttons */}
                <div className="mt-5 pt-4 border-t border-roast-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <span className="text-xs font-bold text-stone-700">零售包裝規格 (Packaging Format):</span>
                  <div className="flex items-center gap-1.5 flex-wrap">
                    {[100, 200, 250, 340, 500, 1000].map(grams => (
                      <button
                        key={grams}
                        type="button"
                        onClick={() => setPackageSizeGrams(grams)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                          packageSizeGrams === grams
                            ? 'bg-copper-500 text-white shadow-sm'
                            : 'bg-roast-100 text-stone-600 hover:bg-roast-200'
                        }`}
                      >
                        {grams === 1000 ? '1 kg' : `${grams}g`}
                      </button>
                    ))}
                    <div className="flex items-center ml-2">
                      <input
                        type="number"
                        step="10"
                        min="50"
                        value={packageSizeGrams}
                        onChange={(e) => setPackageSizeGrams(parseFloat(e.target.value) || 0)}
                        className="w-16 px-2 py-1 border border-roast-200 rounded-lg text-xs font-mono font-semibold text-right"
                      />
                      <span className="ml-1 text-xs text-stone-500">g</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Cost Factors */}
              <div className="bg-white p-6 rounded-2xl border border-roast-200 shadow-sm space-y-5">
                <div className="pb-3 border-b border-roast-100 flex justify-between items-center">
                  <div>
                    <h2 className="text-base font-bold text-roast-950">2. 各階段成本參數 (Cost Factors)</h2>
                    <p className="text-xs text-stone-500">標準化每公斤生豆/熟豆營運成本細項。</p>
                  </div>
                  <span className="text-xs font-mono font-medium px-2.5 py-1 rounded-md bg-roast-100 text-roast-700">
                    生豆到廠價 (Landed): ${calcs.landedGreenPerKg.toFixed(2)}/kg
                  </span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                  <div className="p-3 rounded-xl bg-roast-50/70 border border-roast-200">
                    <label className="text-[11px] font-semibold text-stone-600 block">生豆進價 $/kg (Green FOB)</label>
                    <input
                      type="number"
                      step="0.10"
                      value={rawGreenPricePerKg}
                      onChange={(e) => setRawGreenPricePerKg(parseFloat(e.target.value) || 0)}
                      className="w-full mt-1.5 px-2.5 py-1.5 rounded-lg border border-roast-200 bg-white font-mono font-bold text-xs"
                    />
                  </div>

                  <div className="p-3 rounded-xl bg-roast-50/70 border border-roast-200">
                    <label className="text-[11px] font-semibold text-stone-600 block">生豆運費 $/kg (Inbound Freight)</label>
                    <input
                      type="number"
                      step="0.05"
                      value={greenDeliveryPerKg}
                      onChange={(e) => setGreenDeliveryPerKg(parseFloat(e.target.value) || 0)}
                      className="w-full mt-1.5 px-2.5 py-1.5 rounded-lg border border-roast-200 bg-white font-mono font-bold text-xs"
                    />
                  </div>

                  <div className="p-3 rounded-xl bg-roast-50/70 border border-roast-200">
                    <label className="text-[11px] font-semibold text-stone-600 block">能源與瓦斯 $/kg (Energy & Gas)</label>
                    <input
                      type="number"
                      step="0.05"
                      value={energyCostPerKg}
                      onChange={(e) => setEnergyCostPerKg(parseFloat(e.target.value) || 0)}
                      className="w-full mt-1.5 px-2.5 py-1.5 rounded-lg border border-roast-200 bg-white font-mono font-bold text-xs"
                    />
                  </div>

                  <div className="p-3 rounded-xl bg-roast-50/70 border border-roast-200">
                    <label className="text-[11px] font-semibold text-stone-600 block">烘焙人工 $/kg (Roast Labor)</label>
                    <input
                      type="number"
                      step="0.05"
                      value={laborCostPerKg}
                      onChange={(e) => setLaborCostPerKg(parseFloat(e.target.value) || 0)}
                      className="w-full mt-1.5 px-2.5 py-1.5 rounded-lg border border-roast-200 bg-white font-mono font-bold text-xs"
                    />
                  </div>

                  <div className="p-3 rounded-xl bg-roast-50/70 border border-roast-200">
                    <label className="text-[11px] font-semibold text-stone-600 block">場地設備折舊 $/kg (Overhead)</label>
                    <input
                      type="number"
                      step="0.05"
                      value={overheadPerKg}
                      onChange={(e) => setOverheadPerKg(parseFloat(e.target.value) || 0)}
                      className="w-full mt-1.5 px-2.5 py-1.5 rounded-lg border border-roast-200 bg-white font-mono font-bold text-xs"
                    />
                  </div>

                  <div className="p-3 rounded-xl bg-roast-50/70 border border-roast-200">
                    <label className="text-[11px] font-semibold text-stone-600 block">包裝耗材 $/kg (Packaging)</label>
                    <input
                      type="number"
                      step="0.10"
                      value={packagingCostPerKg}
                      onChange={(e) => setPackagingCostPerKg(parseFloat(e.target.value) || 0)}
                      className="w-full mt-1.5 px-2.5 py-1.5 rounded-lg border border-roast-200 bg-white font-mono font-bold text-xs"
                    />
                  </div>

                  <div className="p-3 rounded-xl bg-roast-50/70 border border-roast-200">
                    <label className="text-[11px] font-semibold text-stone-600 block">出貨運費 $/kg (Outbound Freight)</label>
                    <input
                      type="number"
                      step="0.10"
                      value={transportCostPerKg}
                      onChange={(e) => setTransportCostPerKg(parseFloat(e.target.value) || 0)}
                      className="w-full mt-1.5 px-2.5 py-1.5 rounded-lg border border-roast-200 bg-white font-mono font-bold text-xs"
                    />
                  </div>

                  <div className="p-3 rounded-xl bg-amber-50/80 border border-amber-200">
                    <label className="text-[11px] font-semibold text-amber-900 block">目標毛利率 % (Target Margin)</label>
                    <input
                      type="number"
                      step="1"
                      min="1"
                      max="99"
                      value={targetMarginPct}
                      onChange={(e) => setTargetMarginPct(Math.min(99, Math.max(1, parseFloat(e.target.value) || 0)))}
                      className="w-full mt-1.5 px-2.5 py-1.5 rounded-lg border border-amber-300 bg-white font-mono font-bold text-xs text-amber-950"
                    />
                  </div>
                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    type="button"
                    onClick={handleRecordBatch}
                    className="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-copper-500 hover:bg-copper-600 text-white font-bold text-xs tracking-wide uppercase transition shadow-sm"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>確認並記錄此批次 (Commit & Record Batch)</span>
                  </button>
                </div>
              </div>
            </div>

            {/* Sidebar */}
            <div className="lg:col-span-4 space-y-6">
              <div className="bg-roast-900 text-white p-6 rounded-2xl shadow-md space-y-5">
                <div className="border-b border-roast-800 pb-3 flex justify-between items-center">
                  <h3 className="font-bold text-sm tracking-wide uppercase text-roast-200">成本結構分析 (Economics Breakdown)</h3>
                  <span className="text-[11px] font-mono text-copper-500 font-bold">{packageSizeGrams}g 規格</span>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="flex justify-between items-center text-stone-300">
                    <span>生豆到廠總值 (Landed Green Input)</span>
                    <span className="font-mono font-medium">${calcs.greenCostTotal.toFixed(2)}</span>
                  </div>
                  <div className="flex justify-between items-center text-stone-300">
                    <span>烘焙營運支出 (Roasting Operations)</span>
                    <span className="font-mono font-medium">${calcs.opsCostTotal.toFixed(2)}</span>
                  </div>
                  <div className="flex justify-between items-center text-stone-300">
                    <span>包裝與物流 (Packaging & Freight)</span>
                    <span className="font-mono font-medium">${(calcs.roastedKg * (packagingCostPerKg + transportCostPerKg)).toFixed(2)}</span>
                  </div>
                  
                  <div className="pt-2 border-t border-roast-800 flex justify-between items-center font-bold text-white text-sm">
                    <span>真實每公斤熟豆成本 (Cost / Roasted kg)</span>
                    <span className="font-mono text-copper-500">${calcs.cogsPerRoastedKg.toFixed(2)}</span>
                  </div>
                </div>

                <div className="p-4 rounded-xl bg-roast-800/80 border border-roast-700/60 space-y-2">
                  <div className="flex justify-between text-xs">
                    <span className="text-stone-400">目標毛利率 (Target Margin)</span>
                    <span className="font-bold text-emerald-400 font-mono">{targetMarginPct}%</span>
                  </div>
                  <div className="flex justify-between text-xs">
                    <span className="text-stone-400">單包利潤 (Profit / Bag)</span>
                    <span className="font-bold text-white font-mono">+${(calcs.retailPricePerBag - calcs.cogsPerBag).toFixed(2)}</span>
                  </div>
                  <div className="pt-2 border-t border-roast-700/60 flex justify-between text-sm font-extrabold text-amber-400">
                    <span>建議零售價 (Suggested Retail)</span>
                    <span className="font-mono">${calcs.retailPricePerBag.toFixed(2)}</span>
                  </div>
                </div>

                <div className="text-[11px] text-roast-300 leading-relaxed font-serif italic text-center">
                  "平衡，是懂得取捨的溫柔"
                </div>
              </div>
            </div>
          </div>

          {/* Table */}
          <div className="bg-white rounded-2xl border border-roast-200 shadow-sm overflow-hidden">
            <div className="p-5 border-b border-roast-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <h3 className="font-bold text-roast-950 text-base">Twiggy 烘豆批次日誌 (Roasting Journal)</h3>
                <p className="text-xs text-stone-500">歷史烘焙批次記錄，自動核算失重率與目標利潤售價。</p>
              </div>
              <span className="text-xs font-semibold px-3 py-1 bg-roast-100 text-roast-800 rounded-lg w-fit">
                已記錄 {batches.length} 批次 ({batches.length} {batches.length === 1 ? 'batch' : 'batches'})
              </span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-roast-50/70 border-b border-roast-200 text-stone-500 uppercase font-bold tracking-wider text-[10px]">
                  <tr>
                    <th className="py-3.5 px-5">日期 (Date)</th>
                    <th className="py-3.5 px-4">品名產區 (Lot & Origin)</th>
                    <th className="py-3.5 px-3 text-right">生豆重 (Green kg)</th>
                    <th className="py-3.5 px-3 text-right">熟豆產出 (Roasted kg)</th>
                    <th className="py-3.5 px-3 text-right">批次總成本 (Batch COGS)</th>
                    <th className="py-3.5 px-3 text-right">熟豆成本/kg (Cost/kg)</th>
                    <th className="py-3.5 px-3 text-right">包裝規格 (Pack Size)</th>
                    <th className="py-3.5 px-3 text-right">毛利率 (Margin)</th>
                    <th className="py-3.5 px-4 text-right">建議零售價 (Retail/Bag)</th>
                    <th className="py-3.5 px-4 text-center">操作 (Action)</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-roast-100">
                  {batches.length === 0 ? (
                    <tr>
                      <td colSpan="10" className="py-12 text-center text-stone-400">
                        暫無烘焙批次記錄。請於上方設置並點擊「確認並記錄此批次」。
                      </td>
                    </tr>
                  ) : (
                    batches.map((batch) => (
                      <tr key={batch.id} className="hover:bg-roast-50/50 transition">
                        <td className="py-3.5 px-5 font-mono text-stone-500">{batch.date}</td>
                        <td className="py-3.5 px-4 font-bold text-roast-950">{batch.origin}</td>
                        <td className="py-3.5 px-3 text-right font-mono">{batch.greenKg.toFixed(1)}</td>
                        <td className="py-3.5 px-3 text-right font-mono font-semibold text-roast-800">{batch.roastedKg.toFixed(2)}</td>
                        <td className="py-3.5 px-3 text-right font-mono text-stone-600">${batch.totalBatchCost.toFixed(2)}</td>
                        <td className="py-3.5 px-3 text-right font-mono font-bold text-roast-950">${batch.cogsPerRoastedKg.toFixed(2)}</td>
                        <td className="py-3.5 px-3 text-right text-stone-600">{batch.bagSizeGrams}g</td>
                        <td className="py-3.5 px-3 text-right font-mono text-emerald-700 font-bold">{batch.targetMarginPct}%</td>
                        <td className="py-3.5 px-4 text-right font-mono font-bold text-copper-600">${batch.suggestedRetailPerBag.toFixed(2)}</td>
                        <td className="py-3.5 px-4 text-center">
                          <button
                            onClick={() => handleDeleteBatch(batch.id)}
                            className="text-stone-400 hover:text-rose-600 p-1 transition"
                            title="刪除此記錄 (Delete Batch)"
                          >
                            ✕
                          </button>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 bg-roast-950 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-xl flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
              {toastMsg}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
